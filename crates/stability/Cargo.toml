[package]
name = "optimax-stability"
description = "OptimaX: лабораторія стабільності — детерміновані обчислення з перевіркою результату, запобіжники й вердикт"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Генерація TypeScript-типів для UI (вмикає лише крейт app у тестах).
ts = ["dep:ts-rs"]

[dependencies]
ts-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
