[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/metrics",
    "crates/audit",
    "crates/frametime",
    "crates/diagnosis",
    "crates/tweaks",
    "crates/gamemode",
    "crates/upscale",
    "crates/network",
    "crates/cleanup",
    "crates/app",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
optimax-core = { path = "crates/core" }
optimax-metrics = { path = "crates/metrics" }
optimax-audit = { path = "crates/audit" }
optimax-frametime = { path = "crates/frametime" }
optimax-diagnosis = { path = "crates/diagnosis" }
optimax-tweaks = { path = "crates/tweaks" }
optimax-gamemode = { path = "crates/gamemode" }
optimax-upscale = { path = "crates/upscale" }
optimax-network = { path = "crates/network" }
optimax-cleanup = { path = "crates/cleanup" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
nvml-wrapper = "0.13.0"
windows = "0.62.2"
sha2 = "0.11.1"
tauri = "2.12.5"
tauri-build = "2.7.4"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
